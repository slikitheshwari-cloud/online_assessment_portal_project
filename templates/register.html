<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — CDC Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0a0a0f;--cream:#f5f2eb;--gold:#c9a84c;--green:#3dba6e;--err:#e84545;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#11111a;border:1px solid #222233;border-radius:16px;padding:44px 40px;width:100%;max-width:440px;}
  .logo{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--gold);letter-spacing:.06em;text-align:center;margin-bottom:8px;}
  h2{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:700;text-align:center;margin-bottom:6px;}
  .sub{text-align:center;color:#777;font-size:.9rem;margin-bottom:28px;}
  label{display:block;font-size:.8rem;color:#aaa;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;}
  input{width:100%;background:#1a1a28;border:1px solid #2a2a40;border-radius:8px;padding:12px 14px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.95rem;margin-bottom:18px;outline:none;transition:.2s;}
  input:focus{border-color:var(--gold);}
  .hint{font-size:.78rem;color:#555;margin-top:-14px;margin-bottom:16px;}
  .btn{width:100%;background:var(--gold);color:var(--ink);font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.04em;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.2s;margin-top:4px;}
  .btn:hover{background:#debb66;}
  .error{background:rgba(232,69,69,.12);border:1px solid rgba(232,69,69,.4);color:#ff7070;padding:12px 14px;border-radius:8px;font-size:.88rem;margin-bottom:18px;}
  .success{background:rgba(61,186,110,.12);border:1px solid rgba(61,186,110,.4);color:#5de090;padding:14px 16px;border-radius:8px;font-size:.92rem;margin-bottom:18px;line-height:1.5;}
  .success a{color:var(--gold);font-weight:600;text-decoration:none;}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
  .divider hr{flex:1;border:none;border-top:1px solid #222233;}
  .divider span{color:#444;font-size:.82rem;}
  .links{text-align:center;font-size:.88rem;color:#666;}
  .links a{color:var(--gold);text-decoration:none;font-weight:500;}
  .links a:hover{text-decoration:underline;}
  .strength-bar{height:4px;border-radius:2px;background:#1a1a28;margin-top:-14px;margin-bottom:16px;overflow:hidden;}
  .strength-fill{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CDC</div>
  <h2>Create Account</h2>
  <p class="sub">Register to take the placement assessment</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  {% if success %}
  <div class="success">
    ✅ {{ success }}<br><br>
    <a href="/login">→ Go to Login</a>
  </div>
  {% else %}

  <form method="POST" action="/register" id="regForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Arjun Sharma" required autocomplete="off"
           value="{{ request.form.name if request.form.name else '' }}">

    <label for="roll">Roll Number</label>
    <input type="text" id="roll" name="roll_number" placeholder="e.g. 21MCA001" required autocomplete="off"
           value="{{ request.form.roll_number if request.form.roll_number else '' }}">

    <label for="email">Email Address <span style="color:#555;font-size:.75rem;">(optional)</span></label>
    <input type="email" id="email" name="email" placeholder="you@college.edu" autocomplete="off"
           value="{{ request.form.email if request.form.email else '' }}">

    <label for="pwd">Password</label>
    <input type="password" id="pwd" name="password" placeholder="Min. 6 characters" required oninput="checkStrength(this.value)">
    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>

    <label for="cpwd">Confirm Password</label>
    <input type="password" id="cpwd" name="confirm_password" placeholder="Re-enter password" required oninput="checkMatch()">
    <div class="hint" id="match-hint"></div>

    <button class="btn" type="submit">Create Account →</button>
  </form>

  {% endif %}

  <div class="divider"><hr><span>or</span><hr></div>
  <div class="links">
    Already have an account? <a href="/login">Login here</a>
    &nbsp;·&nbsp; <a href="/">← Home</a>
  </div>
</div>

<script>
function checkStrength(val) {
  const fill = document.getElementById('strength-fill');
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const colors = ['#e84545','#e87a45','#c9a84c','#6dbf67','#3dba6e'];
  fill.style.width  = (score / 5 * 100) + '%';
  fill.style.background = colors[score - 1] || '#1a1a28';
}

function checkMatch() {
  const pwd  = document.getElementById('pwd').value;
  const cpwd = document.getElementById('cpwd').value;
  const hint = document.getElementById('match-hint');
  if (!cpwd) { hint.textContent = ''; return; }
  if (pwd === cpwd) {
    hint.textContent = '✓ Passwords match';
    hint.style.color = '#3dba6e';
  } else {
    hint.textContent = '✗ Passwords do not match';
    hint.style.color = '#e84545';
  }
}

document.getElementById('regForm')?.addEventListener('submit', function(e) {
  const pwd  = document.getElementById('pwd').value;
  const cpwd = document.getElementById('cpwd').value;
  if (pwd !== cpwd) {
    e.preventDefault();
    alert('Passwords do not match!');
  }
});
</script>
</body>
</html>
